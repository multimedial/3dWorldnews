<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Weltkarte</title>
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #0b121e;
            color: #ffffff;
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        #globe-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        .header-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: linear-gradient(180deg, rgba(0, 43, 73, 0.95) 0%, rgba(0, 30, 52, 0.85) 100%);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0, 165, 227, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 1000;
        }

        .progress-bar-container {
            position: absolute;
            top: 56px;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0, 30, 52, 0.5);
            z-index: 1001;
            overflow: hidden;
        }

        #progress-bar {
            width: 100%;
            height: 100%;
            background: #00a5e3;
            box-shadow: 0 0 8px #00a5e3;
            transform-origin: left center;
        }

        .brand-logo {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.5px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo span {
            color: #00a5e3;
            font-weight: 400;
            font-size: 16px;
            border-left: 1px solid rgba(255,255,255,0.2);
            padding-left: 10px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .count-badge {
            font-size: 12px;
            color: #00a5e3;
            background: rgba(0, 165, 227, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 165, 227, 0.3);
            font-weight: 600;
        }

        .selector-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #c2d1e0;
            font-weight: 600;
        }

        .custom-select {
            background: #001e34;
            color: #ffffff;
            border: 1px solid #00a5e3;
            padding: 4px 8px;
            border-radius: 3px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
        }

        .ts-marker-icon {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.15s ease;
            transform: translate(-50%, -50%);
            object-fit: contain;
            background: #ffffff;
            padding: 3px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
            will-change: transform;
        }

        .ts-marker-icon:hover {
            transform: translate(-50%, -50%) scale(1.3);
            box-shadow: 0 0 16px #ffffff;
            z-index: 10000;
        }

        .ts-card {
            position: absolute;
            width: 340px;
            max-height: 520px;
            overflow-y: auto;
            background: #0f1c2e;
            border: 1px solid rgba(0, 165, 227, 0.3);
            border-top: 4px solid #00a5e3;
            padding: 0;
            border-radius: 4px;
            display: none;
            z-index: 99999;
            box-shadow: 0 12px 32px rgba(0,0,0,0.75);
            pointer-events: auto;
        }

        .ts-card-img-container {
            width: 100%;
            height: 180px;
            background: #001e34;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ts-card img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }

        .ts-logo-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 30, 52, 0.85);
            backdrop-filter: blur(4px);
            padding: 4px 8px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
        }

        .ts-card-body {
            padding: 16px;
        }

        .ts-meta {
            font-size: 11px;
            font-weight: 700;
            color: #00a5e3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .ts-card h4 {
            margin: 0 0 10px 0;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.35;
        }

        .ts-card p {
            font-size: 13px;
            color: #c2d1e0;
            line-height: 1.5;
            margin: 0 0 18px 0;
        }

        .ts-btn {
            color: #ffffff;
            background: #004577;
            font-weight: 600;
            text-decoration: none;
            padding: 8px 14px;
            display: inline-block;
            font-size: 12px;
            border-radius: 2px;
            transition: background 0.2s ease;
        }
        .ts-btn:hover {
            background: #00a5e3;
            color: #002b49;
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <div class="brand-logo">
            Nachrichten <span>Weltkarte</span>
        </div>
        <div class="header-controls">
            <div class="count-badge" id="marker-count">
                {{ news|length }} Meldungen geladen
            </div>
            <div class="selector-container">
                <label for="feed-select">Quelle:</label>
                <select id="feed-select" class="custom-select" onchange="changeFeed(this.value)">
                    <option value="all" {% if current_feed == 'all' %}selected{% endif %}>Alle Feeds gleichzeitig</option>
                    <option value="tagesschau" {% if current_feed == 'tagesschau' %}selected{% endif %}>Tagesschau</option>
                    <option value="zdf" {% if current_feed == 'zdf' %}selected{% endif %}>ZDF heute</option>
                    <option value="dw" {% if current_feed == 'dw' %}selected{% endif %}>Deutsche Welle</option>
                    <option value="spiegel" {% if current_feed == 'spiegel' %}selected{% endif %}>Spiegel</option>
                    <option value="zeit" {% if current_feed == 'zeit' %}selected{% endif %}>ZEIT Online</option>
                    <option value="faz" {% if current_feed == 'faz' %}selected{% endif %}>FAZ</option>
                </select>
            </div>
            <div class="selector-container">
                <label for="limit-select">Anzahl:</label>
                <select id="limit-select" class="custom-select" onchange="changeFeedLimit(this.value)">
                    <option value="10" {% if current_limit == 10 %}selected{% endif %}>10</option>
                    <option value="30" {% if current_limit == 30 %}selected{% endif %}>30</option>
                    <option value="50" {% if current_limit == 50 %}selected{% endif %}>50</option>
                    <option value="100" {% if current_limit == 100 %}selected{% endif %}>100</option>
                </select>
            </div>
        </div>
    </header>

    <div class="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <div id="globe-container"></div>
    <div id="info-window" class="ts-card"></div>

    <script>
        let currentLimit = {{ current_limit }};
        let currentFeed = "{{ current_feed }}";
        const REFRESH_INTERVAL_MS = 60000;
        const DEFAULT_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='337' viewBox='0 0 600 337'><defs><linearGradient id='tsGrad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23001e34'/><stop offset='50%' stop-color='%23003358'/><stop offset='100%' stop-color='%23004577'/></linearGradient><linearGradient id='glow' x1='0%' y1='0%' x2='100%' y2='0%'><stop offset='0%' stop-color='%2300a5e3' stop-opacity='0'/><stop offset='50%' stop-color='%2300a5e3' stop-opacity='0.6'/><stop offset='100%' stop-color='%2300a5e3' stop-opacity='0'/></linearGradient></defs><rect width='100%' height='100%' fill='url(%23tsGrad)'/><circle cx='300' cy='168' r='90' fill='none' stroke='%2300a5e3' stroke-width='1.5' opacity='0.25'/><circle cx='300' cy='168' r='130' fill='none' stroke='%2300a5e3' stroke-width='1' opacity='0.15'/><path d='M300 78a138 138 0 0 1 0 180a138 138 0 0 1 0-180z' fill='none' stroke='%2300a5e3' stroke-width='1.5' opacity='0.25'/><line x1='150' y1='168' x2='450' y2='168' stroke='url(%23glow)' stroke-width='2'/><text x='50%' y='48%' font-family='System-UI, -apple-system, sans-serif' font-size='28' font-weight='700' fill='%23ffffff' text-anchor='middle' dominant-baseline='middle' letter-spacing='-0.5'>NEWS</text></svg>";

        const globeContainer = document.getElementById('globe-container');

        const globe = Globe()(globeContainer)
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .htmlElementsData({{ news | tojson }})
            .htmlLat(d => d.lat)
            .htmlLng(d => d.lng)
            .htmlAltitude(0.01)
            .htmlTransitionDuration(0)
            .htmlElement(d => createMarkerElement(d));

        const controls = globe.controls();
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;

        controls.addEventListener('change', () => {
            if (globe.htmlElementsData) {
                globe.htmlElementsData(globe.htmlElementsData());
            }
        });

        globeContainer.addEventListener('mouseenter', () => {
            controls.autoRotate = false;
        });

        globeContainer.addEventListener('mouseleave', () => {
            controls.autoRotate = true;
        });

        function createMarkerElement(d) {
            const img = document.createElement('img');
            img.className = 'ts-marker-icon';
            img.src = d.favicon;
            img.alt = d.source || 'News';

            const markerColor = d.color || '#00a5e3';

            img.onclick = (e) => {
                e.stopPropagation();
                const win = document.getElementById('info-window');
                const imgSrc = (d.image && d.image.trim() !== "") ? d.image : DEFAULT_SVG;

                win.style.borderTopColor = markerColor;

                win.innerHTML = `
                    <div class="ts-card-img-container">
                        <img src="${imgSrc}" onerror="this.onerror=null; this.src='${DEFAULT_SVG}';">
                        <div class="ts-logo-badge" style="border-color: ${markerColor}">
                            <img src="${d.favicon}" style="width: 14px; height: 14px; object-fit: contain;">
                            ${d.source || 'NEWS'}
                        </div>
                    </div>
                    <div class="ts-card-body">
                        <div class="ts-meta" style="color: ${markerColor}">${d.location} ${d.time ? '• ' + d.time : ''}</div>
                        <h4>${d.title}</h4>
                        <p>${d.summary_text}</p>
                        <a class="ts-btn" style="background: ${markerColor}" href="${d.link}" target="_blank">Artikel lesen</a>
                    </div>
                `;

                win.style.left = Math.min(e.clientX + 15, window.innerWidth - 360) + 'px';
                win.style.top = Math.min(e.clientY - 20, window.innerHeight - 500) + 'px';
                win.style.display = 'block';
            };
            return img;
        }

        function resetProgressBar() {
            const bar = document.getElementById('progress-bar');
            bar.style.transition = 'none';
            bar.style.width = '100%';

            void bar.offsetWidth;

            bar.style.transition = `width ${REFRESH_INTERVAL_MS}ms linear`;
            bar.style.width = '0%';
        }

        async function refreshFeed() {
            resetProgressBar();
            try {
                const response = await fetch(`/api/news?limit=${currentLimit}&feed=${currentFeed}`);
                if (!response.ok) return;

                const updatedNews = await response.json();
                globe.htmlElementsData(updatedNews);
                document.getElementById('marker-count').innerText = `${updatedNews.length} Meldungen geladen`;
            } catch (err) {
                console.error("Fehler beim Abrufen der Feed-Daten:", err);
            }
        }

        function changeFeedLimit(newLimit) {
            currentLimit = newLimit;
            refreshFeed();
        }

        function changeFeed(newFeed) {
            currentFeed = newFeed;
            refreshFeed();
        }

        resetProgressBar();
        setInterval(refreshFeed, REFRESH_INTERVAL_MS);

        globeContainer.addEventListener('click', () => {
            document.getElementById('info-window').style.display = 'none';
        });
    </script>
</body>
</html>
